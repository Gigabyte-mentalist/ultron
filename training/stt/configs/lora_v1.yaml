# docs/tz/11_uzbek_stt_finetune.md §3.4 LoRA hyperparameters.
#
# ``base_model`` must be the *original* HF repo id of whichever model
# docs/PROGRESS.md's 03-STT entry names as the benchmark winner -- as of this
# TZ, that's "islomov/rubaistt_v2_medium" (config.yaml's stt.model points at
# its already-converted CTranslate2 copy, data/models/stt/islomov-rubaistt-v2-
# medium-ct2/, which LoRA training can't use directly: CT2 is an inference-only
# format with no gradients). Re-check PROGRESS.md before running -- if a later
# session picked a different winner, update this.
base_model: "islomov/rubaistt_v2_medium"
language: "uzbek"
task: "transcribe"

# Windows-visible paths (this file is read from WSL as /mnt/c/ultron/... or
# /mnt/d/ultron_data/... depending on where config.yaml's app.data_dir points
# -- see training/wake/README.md §0 for why /mnt/d is *not* slow like /mnt/c
# was for the wake dataset: only true for many-small-file random I/O during
# training itself, not for reading a few thousand short utterance clips).
paths:
  personal_train: "/mnt/d/ultron_data/datasets/personal/train.jsonl"
  personal_dev: "/mnt/d/ultron_data/datasets/personal/dev.jsonl"
  data_dir: "/mnt/d/ultron_data" # root that every manifest's audio_path is relative to
  open_train: "open_datasets/train.jsonl" # relative to this training run's own working dir
  open_dev: "open_datasets/dev.jsonl"
  mix_train_out: "mix_train.jsonl"
  mix_dev_out: "mix_dev.jsonl"
  output_dir: "checkpoints/ultron-uz-v1"

# §3.3: "aralashma nisbati: shaxsiy 50% / ochiq 50%". Personal data is much
# smaller than the open corpora, so it's oversampled (duplicated) up to this
# ratio rather than the open side being downsampled -- keeps every open
# example available for the "don't forget general Uzbek" side of the mix.
mix:
  personal_ratio: 0.5

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  # encoder+decoder attention projections -- §3.4's "q_proj, k_proj, v_proj,
  # out_proj (encoder + decoder)". If VRAM is still tight with these four,
  # the README's §5 has the fallback ("faqat decoder + encoder yuqori
  # qatlamlari").
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"]

training:
  fp16: true
  # §3.4 fallback ("VRAM tor bo'lsa"): load the *base* model itself in 8-bit
  # (QLoRA-style) instead of fp16. Try false first; flip to true if training
  # OOMs even at batch_size=2 with gradient_accumulation_steps raised.
  load_in_8bit: false
  gradient_checkpointing: true
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  optim: "adamw_bnb_8bit"
  learning_rate: 1.0e-4
  num_train_epochs: 4
  warmup_ratio: 0.10
  eval_steps: 200
  save_steps: 200
  logging_steps: 25
  save_total_limit: 3
  seed: 42
