[project]
name = "ultron"
version = "0.1.0"
description = "Ultron — lokal o'zbek tilidagi shaxsiy ovozli AI yordamchi"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "loguru",
  "numpy<2.3",
  "sounddevice",
  "soundfile",
  "scipy",
  "onnxruntime",                 # Silero VAD, openWakeWord (CPU)
  "faster-whisper",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12>=9,<10",   # CTranslate2 uchun CUDA DLL'lar
  "torch",
  "transformers",
  "accelerate",               # MMS-TTS
  "ollama",
  "rapidfuzz",
  "aiosqlite",
  "apscheduler>=3.10,<4",
  "psutil",
  "pycaw",
  "comtypes",
  "screen-brightness-control",
  "send2trash",
  "pywin32",
  "pystray",
  "pillow",
  "win11toast",
  "httpx",
  "mss",
  "silero-vad>=6.2.3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "jiwer"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[project.scripts]
ultron = "ultron.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultron"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "hardware: tests that require real audio/GPU hardware",
]
