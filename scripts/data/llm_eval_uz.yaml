# -- system_tools (docs/tz/07_tools.md §7A) -------------------------------------
- input: "Telegram degan dasturni ochib ber"
  expected_tool: open_app
- input: "Brauzerni ishga tushir"
  expected_tool: open_app
- input: "Bloknot dasturini yopib qo'y"
  expected_tool: close_app
- input: "Ovoz balandligini qirq foizga sozla"
